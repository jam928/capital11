spring:
  application:
    name: capital11

  # Defaults match the mysql service in docker-compose.yml.
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/capital_11}
    username: ${DB_USERNAME:capital11}
    password: ${DB_PASSWORD:capital11}

  jpa:
    open-in-view: false
    hibernate:
      # Schema is owned by docker/mysql/init/01-schema.sql; Hibernate only checks it matches.
      ddl-auto: validate
      naming:
        # Keep legacy column names such as dateTrans exactly as written in @Column.
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

  thymeleaf:
    cache: false

server:
  port: 8080
  servlet:
    context-path: /capital11
    session:
      tracking-modes: cookie

springdoc:
  # Only the JSON API is documented; the Thymeleaf pages are not.
  paths-to-match: /api/**
  swagger-ui:
    operations-sorter: method
    tags-sorter: alpha
