<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments :: head('Edit profile')}"></head>
<body>
<header th:replace="~{fragments :: nav('profile')}"></header>

<main class="page page-narrow">
	<section class="card">
		<div class="card-header">
			<h1>Edit profile</h1>
			<p class="muted">Update your contact details and password.</p>
		</div>

		<th:block th:replace="~{fragments :: alerts}"></th:block>

		<form class="form" th:action="@{/profile/edit}" method="post">
			<div class="field">
				<label for="email">Email</label>
				<input type="email" id="email" name="email" th:value="${customer.email}" autocomplete="email" required>
			</div>
			<div class="field">
				<label for="username">Username</label>
				<input type="text" id="username" name="username" th:value="${customer.username}" autocomplete="username" required>
			</div>
			<div class="field">
				<label for="password">New password</label>
				<input type="password" id="password" name="password" autocomplete="new-password">
				<span class="hint">Leave blank to keep your current password.</span>
			</div>
			<div class="actions">
				<button type="submit" class="btn">Save changes</button>
				<a class="btn btn-secondary" th:href="@{/profile}">Cancel</a>
			</div>
		</form>
	</section>
</main>
</body>
</html>
