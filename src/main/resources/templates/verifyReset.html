<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments :: head('Reset password')}"></head>
<body>
<div class="auth-theme"><button th:replace="~{fragments :: themeToggle}"></button></div>
<main class="auth">
	<div class="auth-card">
		<a th:replace="~{fragments :: brand}"></a>

		<section class="card">
			<div class="card-header">
				<h1>Reset your password</h1>
				<p class="muted">Enter your username to continue.</p>
			</div>

			<th:block th:replace="~{fragments :: alerts}"></th:block>

			<form class="form" th:action="@{/forgot-password}" method="post">
				<div class="field">
					<label for="username">Username</label>
					<input type="text" id="username" name="username" autocomplete="username" required autofocus>
				</div>
				<button type="submit" class="btn btn-block">Continue</button>
			</form>
		</section>

		<p class="auth-footer"><a th:href="@{/login}">Back to log in</a></p>
	</div>
</main>
</body>
</html>
