<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<title>Enter Username</title>
	<link type="text/css" rel="stylesheet" th:href="@{/css/main.css}">
	<link type="text/css" rel="stylesheet" th:href="@{/css/verifyReset.css}">
</head>
<body>

	<div th:replace="~{fragments :: header}"></div>

	<div id="container">
		<h3>Reset Password</h3>

		<th:block th:replace="~{fragments :: alerts}"></th:block>

		<form th:action="@{/forgot-password}" method="post">
			<table>
				<tbody>
					<tr>
						<td><label for="username">Username: </label></td>
						<td><input type="text" id="username" name="username" required autofocus></td>
					</tr>
					<tr>
						<td><label></label></td>
						<td><input type="submit" value="Verify" class="verify"></td>
					</tr>
				</tbody>
			</table>
		</form>

		<p>
			<a th:href="@{/login}">Back to the Login page</a>
		</p>
	</div>
</body>
</html>
