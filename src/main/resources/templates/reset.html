<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments :: head('Reset password')}"></head>
<body>
<div class="auth-theme"><button th:replace="~{fragments :: themeToggle}"></button></div>
<main class="auth">
	<div class="auth-card">
		<a th:replace="~{fragments :: brand}"></a>

		<section class="card">
			<div class="card-header">
				<h1>Choose a new password</h1>
				<p class="muted" th:if="${username}">For <strong th:text="${username}">username</strong></p>
			</div>

			<th:block th:replace="~{fragments :: alerts}"></th:block>

			<form class="form" th:action="@{/reset-password}" method="post">
				<div class="field">
					<label for="password">New password</label>
					<input type="password" id="password" name="password" autocomplete="new-password" required autofocus>
				</div>
				<button type="submit" class="btn btn-block">Update password</button>
			</form>
		</section>

		<p class="auth-footer"><a th:href="@{/login}">Back to log in</a></p>
	</div>
</main>
</body>
</html>
