<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments :: head('Dashboard')}"></head>
<body>
<header th:replace="~{fragments :: nav('main')}"></header>

<main class="page">
	<div class="page-header">
		<h1>Hi, <span th:text="${customer.name}">Name</span></h1>
		<p class="muted">Here's what's happening with your account.</p>
	</div>

	<th:block th:replace="~{fragments :: alerts}"></th:block>

	<section class="hero" aria-label="Balance">
		<div>
			<p class="hero-label">Available balance</p>
			<p class="hero-balance num" th:text="|$${#numbers.formatDecimal(account.balance, 1, 'COMMA', 2, 'POINT')}|">$0.00</p>
		</div>
		<div class="hero-meta">
			<span th:text="|${account.type.label} account|">Checking account</span>
			<span class="num" th:text="|No. ${account.acctNum}|">No. 1</span>
		</div>
		<div class="hero-actions">
			<a class="btn" th:href="@{/deposit}">Deposit</a>
			<a class="btn btn-ghost" th:href="@{/withdraw}">Withdraw</a>
		</div>
	</section>

	<section class="card">
		<div class="card-header">
			<h2>Recent activity</h2>
		</div>

		<ul class="tx-list" th:unless="${#lists.isEmpty(transactions)}">
			<li th:each="tx : ${transactions}" th:with="deposit=${tx.type.name() == 'DEPOSIT'}"
				th:class="${deposit} ? 'tx tx-deposit' : 'tx tx-withdrawal'">
				<span class="tx-icon" aria-hidden="true" th:text="${deposit} ? '+' : '−'">+</span>
				<div>
					<p class="tx-title" th:text="${tx.type.label}">Deposit</p>
					<p class="tx-date" th:text="${#temporals.format(tx.date, 'MMM d, yyyy · h:mm a')}">Jan 1, 2026 · 9:00 AM</p>
				</div>
				<span class="tx-amount num"
					th:text="|${deposit ? '+' : '−'}$${#numbers.formatDecimal(tx.amount, 1, 'COMMA', 2, 'POINT')}|">+$0.00</span>
			</li>
		</ul>

		<p class="empty" th:if="${#lists.isEmpty(transactions)}">No transactions yet. Make your first deposit to get started.</p>
	</section>
</main>
</body>
</html>
