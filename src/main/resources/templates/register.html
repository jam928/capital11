<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<title>Capital 11 Bank</title>
	<link rel="stylesheet" type="text/css" th:href="@{/css/style.css}">
	<style>
		body { background-color: #f1f1f1; }
	</style>
</head>
<body>
<h1 align="center">User Account Creation</h1>

<div class="form">
	<form id="contactform" th:action="@{/register}" th:object="${form}" method="post">

		<p class="contact"><label for="name">Name</label></p>
		<input th:field="*{name}" placeholder="First and last name" required tabindex="1" type="text">
		<span class="error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></span>

		<p class="contact"><label for="email">Email</label></p>
		<input th:field="*{email}" placeholder="example@domain.com" required type="email">
		<span class="error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>

		<p class="contact"><label for="username">Create a username</label></p>
		<input th:field="*{username}" placeholder="username" required tabindex="2" type="text">
		<span id="username-status"></span>
		<span class="error" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></span>
		<br>

		<p class="contact"><label for="password">Create a password</label></p>
		<input th:field="*{password}" type="password" required>
		<span class="error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></span>

		<p class="contact"><label for="confirmPassword">Confirm your password</label></p>
		<input th:field="*{confirmPassword}" type="password" required>
		<span class="error" th:if="${#fields.hasErrors('passwordConfirmed')}" th:errors="*{passwordConfirmed}"></span>

		<fieldset>
			<label>Birthday</label>
			<label class="month">
				<select class="select-style" th:field="*{birthMonth}" required>
					<option value="">Month</option>
					<option value="1">January</option>
					<option value="2">February</option>
					<option value="3">March</option>
					<option value="4">April</option>
					<option value="5">May</option>
					<option value="6">June</option>
					<option value="7">July</option>
					<option value="8">August</option>
					<option value="9">September</option>
					<option value="10">October</option>
					<option value="11">November</option>
					<option value="12">December</option>
				</select>
			</label>
			<label>Day <input class="birthday" th:field="*{birthDay}" maxlength="2" placeholder="Day" required></label>
			<label>Year <input class="birthyear" th:field="*{birthYear}" maxlength="4" placeholder="Year" required></label>
			<span class="error" th:if="${#fields.hasErrors('birthMonth') or #fields.hasErrors('birthDay') or #fields.hasErrors('birthYear')}">Enter a valid birthday</span>
		</fieldset>

		Select Gender:
		<select class="select-style gender" th:field="*{gender}" required>
			<option value="">i am..</option>
			<option value="m">Male</option>
			<option value="f">Female</option>
			<option value="others">Other</option>
		</select>
		<span class="error" th:if="${#fields.hasErrors('gender')}" th:errors="*{gender}"></span><br><br>

		Select Account Type:
		<select class="select-style acct" th:field="*{accountType}">
			<option th:each="type : ${accountTypes}" th:value="${type}" th:text="${type.label}">Checking</option>
		</select><br><br>

		<input class="buttom" id="submit" tabindex="5" value="Sign me up!" type="submit">
	</form>
	<p><a th:href="@{/login}">Back to login</a></p>
</div>

<script th:inline="javascript">
	const checkUrl = /*[[@{/register/username-check}]]*/ '/register/username-check';
	const usernameInput = document.getElementById('username');
	const status = document.getElementById('username-status');
	usernameInput.addEventListener('input', async () => {
		const username = usernameInput.value.trim();
		if (!username) {
			status.innerHTML = '';
			return;
		}
		const response = await fetch(checkUrl + '?username=' + encodeURIComponent(username));
		status.innerHTML = await response.text();
	});
</script>
</body>
</html>
