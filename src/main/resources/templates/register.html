<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments :: head('Create account')}"></head>
<body>
<div class="auth-theme"><button th:replace="~{fragments :: themeToggle}"></button></div>
<main class="auth">
	<div class="auth-card wide">
		<a th:replace="~{fragments :: brand}"></a>

		<section class="card">
			<div class="card-header">
				<h1>Open an account</h1>
				<p class="muted">It only takes a minute.</p>
			</div>

			<form class="form" th:action="@{/register}" th:object="${form}" method="post">
				<div class="field">
					<label for="name">Full name</label>
					<input th:field="*{name}" th:errorclass="is-invalid" type="text" autocomplete="name" required autofocus>
					<span class="error-text" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></span>
				</div>

				<div class="field">
					<label for="email">Email</label>
					<input th:field="*{email}" th:errorclass="is-invalid" type="email" autocomplete="email" placeholder="you@example.com" required>
					<span class="error-text" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
				</div>

				<div class="field">
					<label for="username">Username</label>
					<input th:field="*{username}" th:errorclass="is-invalid" type="text" autocomplete="username" required>
					<span id="username-status" class="username-status" aria-live="polite"></span>
					<span class="error-text" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></span>
				</div>

				<div class="field-row">
					<div class="field">
						<label for="password">Password</label>
						<input th:field="*{password}" th:errorclass="is-invalid" type="password" autocomplete="new-password" required>
						<span class="error-text" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></span>
					</div>
					<div class="field">
						<label for="confirmPassword">Confirm password</label>
						<input th:field="*{confirmPassword}" type="password" autocomplete="new-password" required
							th:classappend="${#fields.hasErrors('passwordConfirmed')} ? 'is-invalid'">
						<span class="error-text" th:if="${#fields.hasErrors('passwordConfirmed')}" th:errors="*{passwordConfirmed}"></span>
					</div>
				</div>

				<fieldset class="field fieldset">
					<legend class="label">Birthday</legend>
					<div class="field-row birthday">
						<select th:field="*{birthMonth}" aria-label="Month" required
							th:classappend="${#fields.hasErrors('birthMonth')} ? 'is-invalid'">
							<option value="">Month</option>
							<option value="1">January</option>
							<option value="2">February</option>
							<option value="3">March</option>
							<option value="4">April</option>
							<option value="5">May</option>
							<option value="6">June</option>
							<option value="7">July</option>
							<option value="8">August</option>
							<option value="9">September</option>
							<option value="10">October</option>
							<option value="11">November</option>
							<option value="12">December</option>
						</select>
						<input th:field="*{birthDay}" type="text" inputmode="numeric" maxlength="2" placeholder="Day" aria-label="Day" required
							th:classappend="${#fields.hasErrors('birthDay')} ? 'is-invalid'">
						<input th:field="*{birthYear}" type="text" inputmode="numeric" maxlength="4" placeholder="Year" aria-label="Year" required
							th:classappend="${#fields.hasErrors('birthYear')} ? 'is-invalid'">
					</div>
					<span class="error-text" th:if="${#fields.hasErrors('birthMonth') or #fields.hasErrors('birthDay') or #fields.hasErrors('birthYear')}">Enter a valid birthday</span>
				</fieldset>

				<div class="field-row">
					<div class="field">
						<label for="gender">Gender</label>
						<select th:field="*{gender}" th:errorclass="is-invalid" required>
							<option value="">Select…</option>
							<option value="m">Male</option>
							<option value="f">Female</option>
							<option value="others">Other</option>
						</select>
						<span class="error-text" th:if="${#fields.hasErrors('gender')}" th:errors="*{gender}"></span>
					</div>
					<div class="field">
						<label for="accountType">Account type</label>
						<select th:field="*{accountType}">
							<option th:each="type : ${accountTypes}" th:value="${type}" th:text="${type.label}">Checking</option>
						</select>
					</div>
				</div>

				<button type="submit" class="btn btn-block">Create account</button>
			</form>
		</section>

		<p class="auth-footer">Already have an account? <a th:href="@{/login}">Log in</a></p>
	</div>
</main>

<script th:inline="javascript">
	const checkUrl = /*[[@{/register/username-check}]]*/ '/register/username-check';
	const usernameInput = document.getElementById('username');
	const status = document.getElementById('username-status');
	let pending;
	usernameInput.addEventListener('input', () => {
		clearTimeout(pending);
		const username = usernameInput.value.trim();
		if (!username) {
			status.innerHTML = '';
			return;
		}
		pending = setTimeout(async () => {
			const response = await fetch(checkUrl + '?username=' + encodeURIComponent(username));
			status.innerHTML = await response.text();
		}, 250);
	});
</script>
</body>
</html>
