<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:fragment="head(title)">
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title th:text="|${title} · Capital 11 Bank|">Capital 11 Bank</title>
	<script>
		// Apply the saved theme before first paint to avoid a flash of the wrong colours.
		try {
			const theme = localStorage.getItem('theme');
			if (theme === 'light' || theme === 'dark') {
				document.documentElement.dataset.theme = theme;
				document.documentElement.dataset.themePref = theme;
			}
		} catch (e) {
		}
	</script>
	<link rel="stylesheet" th:href="@{/css/app.css}">
	<script th:src="@{/js/theme.js}" defer></script>
</head>

<body>

<a th:fragment="brand" class="brand" th:href="@{/}">
	<span class="brand-mark" aria-hidden="true">C11</span>
	Capital 11 Bank
</a>

<!-- Top bar for signed-in pages; active is one of main, deposit, withdraw, profile. -->
<header th:fragment="nav(active)" class="topbar">
	<div class="topbar-inner">
		<a class="brand" th:href="@{/main}">
			<span class="brand-mark" aria-hidden="true">C11</span>
			Capital 11 Bank
		</a>
		<nav class="nav" aria-label="Main">
			<a th:href="@{/main}" th:attrappend="aria-current=${active == 'main'} ? 'page'">Dashboard</a>
			<a th:href="@{/deposit}" th:attrappend="aria-current=${active == 'deposit'} ? 'page'">Deposit</a>
			<a th:href="@{/withdraw}" th:attrappend="aria-current=${active == 'withdraw'} ? 'page'">Withdraw</a>
			<a th:href="@{/profile}" th:attrappend="aria-current=${active == 'profile'} ? 'page'">Profile</a>
			<a th:href="@{/logout}">Log out</a>
		</nav>
		<button th:replace="~{fragments :: themeToggle}"></button>
	</div>
</header>

<!-- Cycles System / Light / Dark; the icon shows the current choice. Behaviour lives in js/theme.js. -->
<button th:fragment="themeToggle" type="button" class="theme-toggle" data-theme-toggle aria-label="Theme" title="Theme">
	<svg class="icon-system" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
		<rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/>
	</svg>
	<svg class="icon-light" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
		<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
	</svg>
	<svg class="icon-dark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
		<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
	</svg>
</button>

<th:block th:fragment="alerts">
	<p class="alert alert-success" role="status" th:if="${message}" th:text="${message}"></p>
	<p class="alert alert-error" role="alert" th:if="${error}" th:text="${error}"></p>
</th:block>

</body>
</html>
