<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments :: head('Withdraw')}"></head>
<body>
<header th:replace="~{fragments :: nav('withdraw')}"></header>

<main class="page page-narrow">
	<section class="card">
		<div class="card-header">
			<h1>Withdraw money</h1>
			<p class="muted">Take funds out of your account.</p>
		</div>

		<th:block th:replace="~{fragments :: alerts}"></th:block>

		<form class="form" th:action="@{/withdraw}" method="post">
			<div class="field">
				<label for="amount">Amount</label>
				<div class="input-prefix">
					<span aria-hidden="true">$</span>
					<input type="number" id="amount" name="amount" min="0.01" step="0.01" inputmode="decimal"
						placeholder="0.00" th:value="${param.amount}" required autofocus>
				</div>
			</div>
			<div class="actions">
				<button type="submit" class="btn">Withdraw</button>
				<a class="btn btn-secondary" th:href="@{/main}">Cancel</a>
			</div>
		</form>
	</section>
</main>
</body>
</html>
